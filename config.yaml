input:
  pgn_path: "data/input/opponent.pgn"

output:
  report_path: "data/reports/report.md"
  json_path: "data/reports/report.json"
  critical_pgn_path: "data/reports/critical_positions.pgn"

target_player:
  # If empty, the loader will auto-detect the most frequent player of the
  # given color in the PGN.
  name: ""
  # "white", "black", or "both" (runs the full pipeline twice, once per
  # color, writing separate report_white.*/report_black.* output files).
  color: "black"

stockfish:
  path: "/usr/games/stockfish"
  # This container has 4 CPU cores; requesting more Threads than that just
  # causes thread contention and slows Stockfish down, not speeds it up.
  threads: 3
  hash_mb: 512

analysis:
  main_depth: 18
  critical_depth: 24
  main_multipv: 1
  # Kept at 1 (not the usual 3) purely for this 1-hour speed run - MultiPV
  # scales search cost roughly with N, and time is the binding constraint
  # here, not analysis richness. Raise back to 3 for slower/unconstrained runs.
  critical_multipv: 3

  # Hard-budget mode: bound each engine call by wall-clock time instead of
  # depth, so total run time is predictable regardless of host CPU speed
  # (this container measured ~1.5s/call at fixed depth 18, which would put
  # the full 858-game batch at 20+ hours). depth above is still recorded on
  # results/cache keys for reporting; movetime is what actually governs
  # search time when set. Remove/null these two keys to go back to
  # pure fixed-depth search once running on faster/dedicated hardware.
  # 13h-deep-run calibration for 1191 games on this host.
  main_movetime_ms: 360
  critical_movetime_ms: 1080

  # Centipawn-loss thresholds (from the target player's perspective)
  inaccuracy_cp: 50
  mistake_cp: 100
  blunder_cp: 200

  # Threshold above which a position is flagged for Stage-2 deep analysis
  critical_cp: 150

  analyze_opening_plies: 20

  # A move played with this many seconds or fewer left on the clock (per
  # PGN %clk data) is flagged as played under time trouble.
  time_pressure_threshold_sec: 30

  # Minimum sample size required to report a statistical pattern
  min_sample_size: 8
  reliable_sample_size: 20

performance:
  workers: 1

cache:
  db_path: "data/cache/engine_cache.sqlite"

logging:
  log_path: "data/logs/app.log"
  level: "INFO"

llm:
  # AI explanation layer (Gemini). Used only for top recurring patterns,
  # critical positions, and the final preparation summary - never per move.
  # Disabled automatically if the API key is missing or the call fails;
  # the structured, data-only report is always generated regardless.
  enabled: true
  model: "gemini-3.6-flash"
  # Name of the environment variable holding the API key (see .env.example).
  api_key_env: "GEMINI_API_KEY"
  max_patterns: 10
  max_critical_positions: 20
